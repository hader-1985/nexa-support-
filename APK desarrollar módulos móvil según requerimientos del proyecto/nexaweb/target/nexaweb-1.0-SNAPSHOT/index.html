<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexa Support</title>

  <!-- 📌 Bootstrap para estilos rápidos y responsivos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- 📌 Librería de animaciones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    /* 🎨 Estilo general del body con imagen de fondo */
    body {
      background-image: url('img/fondo_web.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 🌙 Botón de modo oscuro */
    .toggle-theme {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .toggle-theme:hover { background: rgba(0, 0, 0, 0.1); }

    /* ✨ Título principal con degradado */
    .titulo {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(90deg, #0d6efd, #0a4fa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1.2s ease-in-out;
      margin-top: 20px;
    }

    /* 🔹 Subtítulo debajo del título */
    .subtitulo {
      font-size: 1.2rem;
      color: #0a4fa3;
      font-weight: 500;
      margin-bottom: 25px;
      animation: fadeIn 1.5s ease-in-out;
    }

    /* 🎞️ Animación fadeIn */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📦 Contenedor principal del formulario */
    .contenedor-principal {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 60px;
    }

    /* 📝 Caja del formulario */
    .form-container {
      width: 380px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      z-index: 2;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 🔘 Botón de ingresar */
    .btn-primary {
      background: linear-gradient(90deg, #0d6efd, #0a4fa3);
      border: none;
      transition: 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #0a4fa3, #0d6efd);
      transform: scale(1.05);
    }

    /* 🔗 Enlaces de navegación (registro, recuperar clave) */
    .nav-login {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .nav-login a {
      text-decoration: none;
      color: #0d6efd;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }
    .nav-login a:hover { text-decoration: underline; }

    /* 👁️ Mostrar/ocultar contraseña */
    .toggle-pass {
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 5px;
      color: #007bff;
      transition: color 0.3s ease;
    }
    .toggle-pass:hover { text-decoration: underline; }

    /* 📌 Footer */
    footer {
      background: linear-gradient(90deg, #0d6efd, #0a4fa3);
      text-align: center;
      padding: 10px;
      font-size: 1.1rem;
      color: #fffbfb;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 📱 Ajustes responsivos */
    @media (max-width: 768px) {
      .contenedor-principal {
        justify-content: center;
        padding: 20px;
      }
      .form-container {
        width: 100%;
        max-width: 350px;
      }
      .titulo { font-size: 2.2rem; }
    }

    /* 🌙 Estilos en modo oscuro */
    body.dark { color: #f0f0f0; }
    body.dark .form-container {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f0f0f0;
    }
    body.dark .titulo {
      background: linear-gradient(90deg, #66b2ff, #3385ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    body.dark .subtitulo { color: #aaccff; }
    body.dark .toggle-theme {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
    }
    body.dark footer {
      background: linear-gradient(90deg, #0a1a2f, #0d2b4d);
      color: #ccc;
    }
    body.dark .nav-login a,
    body.dark .toggle-pass { color: #aaccff; }
    body.dark .nav-login a:hover,
    body.dark .toggle-pass:hover { color: #cce6ff; }
  </style>
</head>
<body>
  <!-- 🔘 Botón que alterna entre modo claro y oscuro -->
  <button class="toggle-theme" id="themeToggle">🌙 Modo Oscuro</button>

  <!-- 🏷️ Encabezado -->
  <div class="text-center">
    <h1 class="titulo">Nexa Support</h1>
    <p class="subtitulo">Soporte remoto eficiente y confiable</p>
  </div>

  <!-- 📦 Contenedor del formulario -->
  <div class="contenedor-principal">
    <div class="form-container animate__animated animate__fadeInRight">
      <h2 class="text-center mb-4">Inicio de Sesión</h2>
      
      <!-- 📝 Formulario de login -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
          <span class="toggle-pass" id="togglePassword">Mostrar contraseña</span>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>

        <!-- ⚠️ Mensaje de error oculto por defecto -->
        <div id="errorMsg" class="alert alert-danger mt-3 d-none" role="alert">
          Usuario o contraseña incorrectos.
        </div>
      </form>

      <!-- 🔗 Navegación: registro y recuperar clave -->
      <div class="nav-login mt-3">
        <a href="registro.html">¿No eres cliente aún? Regístrate</a>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>

  <!-- 📌 Footer -->
  <footer>
    <p>&copy; 2025 Nexa Support. Todos los derechos reservados.</p>
  </footer>

  <!-- 🌙 Script de modo oscuro -->
  <script>
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      if (document.body.classList.contains("dark")) {
        themeToggle.textContent = "☀️ Modo Claro";
      } else {
        themeToggle.textContent = "🌙 Modo Oscuro";
      }
    });
  </script>

  <!-- 📌 Archivo externo JS (para validar login, etc.) -->
  <script src="js/support.js"></script>
</body>
</html>
